name: PR title

on:
  # No 'synchronize': that fires on every push to the branch, and pushing commits cannot
  # change the pull request's title. 'edited' is what catches a retitle.
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      # Titles only, not individual commits. Merging produces one merge commit named
      # after the PR, so a changelog can be assembled from titles while commit bodies
      # stay free prose -- which matters in this repository, where those bodies carry
      # the reasoning for why the code looks the way it does.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          # Scopes are optional, but when present should name the area touched, matching
          # the repository's issue labels and layout.
          scopes: |
            homie
            mqtt
            networking
            roomsensor
            irrigation
            oven
            tests
            scripts
            ci
            docs
          requireScope: false
          # Subject in lower case, no trailing period: "add the echo check", not
          # "Add the echo check."
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" is invalid for the "{type}" type.
            Start it in lower case and leave off the trailing period.
