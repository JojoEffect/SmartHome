name: Claude Code

# Responds to @claude mentions in issue/PR comments and PR review comments.
# Covers two workflows for this repo:
#   - on-demand PR review: comment "@claude review this" on a PR
#   - issue -> PR: comment "@claude implement this" on an issue
#
# No auto-trigger on PR open/push by design (single-developer repo; review
# runs when actually requested rather than on every push).
#
# Setup (one-time, needs GitHub repo admin access):
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Generate a subscription token locally:  claude setup-token
#   3. Add it as a repo secret named CLAUDE_CODE_OAUTH_TOKEN
#      (Settings -> Secrets and variables -> Actions -> New repository secret)
# See CLAUDE.md and https://code.claude.com/docs/en/github-actions for details.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
