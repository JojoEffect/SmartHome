name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request makes the previous run irrelevant. Pushes to main are
# NOT cancelled: with CI as a required check, a cancelled run leaves that commit neither
# passed nor failed, so two merges in quick succession could leave main carrying a commit
# nothing ever verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit test
    # Windows is not a preference. .nfproj is a classic MSBuild project and the
    # nanoFramework build tasks are Windows-only.
    runs-on: windows-latest

    # Windows PowerShell 5.1 throughout, not pwsh. The repository's scripts are written
    # and verified against 5.1, whose Set-StrictMode -Version Latest behaves differently
    # from PowerShell 7's -- notably around missing hashtable keys. CI should run the
    # interpreter the scripts were written for, or it is testing something else.
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - uses: nuget/setup-nuget@v4

      # Extracted into a composite action: the release workflow needs the identical
      # setup, and the reasoning behind it is long enough that a second copy would
      # drift. See .github/actions/setup-nanoframework/action.yml.
      - name: Set up nanoFramework build components
        uses: ./.github/actions/setup-nanoframework
        with:
          github-token: ${{ github.token }}

      # msbuild /t:Restore is a no-op for this project style -- see
      # scripts\Restore-Packages.ps1 for the same note.
      - name: Restore packages.config dependencies
        run: nuget restore SmartHome.sln

      - name: Build solution
        run: msbuild SmartHome.sln /p:Configuration=Debug /v:minimal /nologo /nodeReuse:false

      # The virtual device: the same CLR, run on the host. This is what lets the 34 unit
      # tests run without a board.
      #
      # Pinned, and install-or-update rather than plain install. Pinned because an
      # unpinned CLR means the runtime under the tests can change with
      # no commit in this repository -- green today, red tomorrow, nothing to bisect.
      # Bump this deliberately, like any other dependency.
      #
      # Install-or-update because `dotnet tool install` exits 1 when the tool is already
      # present. A hosted runner is fresh every time so plain install works there, but it
      # would fail on the very first re-run of the self-hosted runner in #26, where the
      # global tool persists between jobs.
      - name: Install nanoclr
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.1.122'
          $installed = (dotnet tool list -g | Select-String -Pattern '^\s*nanoclr\s')
          if ($installed) {
              Write-Host "nanoclr already present; updating to $version."
              dotnet tool update -g nanoclr --version $version
          }
          else {
              dotnet tool install -g nanoclr --version $version
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not install nanoclr $version." }

          # Confirm via `dotnet tool list`, not by invoking nanoclr. Two reasons: the
          # global tools directory is added to PATH for *subsequent* steps, not this one,
          # and a native command's exit code becomes the step's exit code -- so a probe
          # like `nanoclr --help` fails the step whether or not the tool is fine.
          if (-not (dotnet tool list -g | Select-String -Pattern '^\s*nanoclr\s+')) {
              throw "nanoclr is not present after install."
          }
          Write-Host "nanoclr $version ready."

      # Run-Tests.ps1 sources scripts\local.env.ps1, which is git-ignored because it holds
      # per-machine settings. CI has no machine to describe, so the template stands in --
      # its COM port is never used, because IsRealHardware is False.
      - name: Provide a local environment file
        shell: powershell
        run: Copy-Item scripts\local.env.template.ps1 scripts\local.env.ps1

      # Deliberately the same entry point developers use, not a bespoke vstest line. It
      # carries the rule that a run which executed zero tests is a failure -- vstest exits
      # 0 when every test is *skipped*, and this repository has already shipped three
      # commits on a green run that executed nothing.
      - name: Run unit tests on the virtual device
        shell: powershell
        run: .\scripts\Run-Tests.ps1 -RunSettings nano.ci.runsettings

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: src/tests/Unit/TestResults/
          if-no-files-found: warn
